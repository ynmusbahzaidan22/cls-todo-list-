<section class="deleted-preview-section" id="deleted-preview-section" aria-labelledby="deleted-preview-title" hidden>
          <div class="deleted-preview-heading">
            <div>
              <h2 id="deleted-preview-title">Recently deleted <span class="deleted-preview-badge" id="deleted-task-count" hidden></span></h2>
              <p class="deleted-preview-count" id="deleted-preview-count">Tasks can be restored for 24 hours.</p>
            </div>
            <button class="secondary-button" id="open-deleted-view" type="button" hidden>View all</button>
          </div>
          <p class="deleted-preview-status" id="deleted-preview-loading" role="status" aria-live="polite" hidden>Loading deleted tasks…</p>
          <p class="deleted-preview-status" id="deleted-preview-error" role="alert" hidden>Couldn't load deleted tasks.</p>
          <button class="secondary-button deleted-preview-retry" id="retry-deleted-preview" type="button" hidden>Try again</button>
          <ul class="task-list deleted-preview-list" id="deleted-preview-list" aria-label="Recently deleted tasks"></ul>
        </section>
