<section class="workspace-header" id="authenticated-view" aria-label="Signed-in account" hidden>
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <h1 class="brand-name" id="page-title" tabindex="-1">My To-Do List</h1>
        </div>
        <nav class="workspace-jump-links" aria-label="Task workspace sections">
          <a href="#task-section" id="open-tasks">Tasks</a>
          <a href="#template-section" id="open-templates">Task templates</a>
          <a href="#completed" id="open-completed">Completed <span class="nav-count completed-nav-count" id="completed-task-count" hidden></span></a>
        </nav>
        <div class="workspace-account">
          <p class="signed-in-email" id="signed-in-email"></p>
          <button class="sign-out-button" id="logout-button" type="button">Sign out</button>
        </div>
        <p class="auth-feedback signed-in-feedback" id="logout-feedback" role="status" aria-live="polite" hidden></p>
      </section>
