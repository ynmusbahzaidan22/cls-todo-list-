<section class="template-section" id="template-section" aria-labelledby="templates-title">
          <div class="list-heading">
            <h2 id="templates-title">Task templates</h2>
            <button class="secondary-button" id="new-template-button" type="button">Create template</button>
          </div>
          <p class="template-feedback" id="template-feedback" role="status" aria-live="polite" hidden></p>
          <p class="template-loading" id="template-loading" role="status" aria-live="polite" hidden>Loading templates…</p>
          <p class="template-empty" id="template-empty" hidden>No templates yet. Create one to reuse a group of tasks.</p>
          <ul class="template-list" id="template-list" aria-label="Your task templates"></ul>
        </section>
