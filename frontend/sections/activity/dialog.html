<dialog class="activity-dialog" id="activity-dialog" aria-labelledby="activity-task-title">
        <div class="activity-dialog-header">
          <div>
            <p class="eyebrow">TASK DETAILS</p>
            <h2 id="activity-task-title">Task details</h2>
          </div>
          <button class="dialog-close-button" id="activity-close-button" type="button" aria-label="Close activity history">×</button>
        </div>
        <div class="activity-dialog-content" id="activity-dialog-content" aria-busy="false">
          <h3 class="activity-history-heading">Activity history</h3>
          <p class="activity-loading" id="activity-loading" role="status" aria-live="polite" hidden>Loading activity…</p>
          <div class="activity-error" id="activity-error" role="alert" hidden>
            <p id="activity-error-message">We couldn't load this task's history.</p>
            <button class="secondary-button" id="activity-retry-button" type="button">Try again</button>
          </div>
          <p class="activity-action-feedback" id="activity-action-feedback" role="status" aria-live="polite" hidden></p>
          <p class="activity-empty" id="activity-empty" hidden>No activity has been recorded for this task yet.</p>
          <ol class="activity-list" id="activity-list" aria-label="Task activity events"></ol>
          <button class="secondary-button activity-more-button" id="activity-more-button" type="button" hidden>Load older activity</button>
        </div>
        <div class="task-detail-footer" id="activity-task-footer">
          <div class="task-detail-footer-actions">
            <button class="secondary-button" id="activity-edit-task" type="button">Edit</button>
            <button class="delete-button" id="activity-delete-task" type="button">Delete</button>
          </div>
        </div>
      </dialog>
