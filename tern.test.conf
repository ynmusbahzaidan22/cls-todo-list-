# Test-only migration target. Populate PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD/PGSSLMODE
# from a validated TEST_DATABASE_URL with ops/Invoke-TestMigrations.ps1.
[database]
host = {{ env "PGHOST" }}
port = {{ env "PGPORT" }}
database = {{ env "PGDATABASE" }}
user = {{ env "PGUSER" }}
sslmode = {{ env "PGSSLMODE" }}
